name: Release extension
on:
  push:
permissions:
  contents: read
concurrency:
  group: extension-release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect version increase
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/release.py detect
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.version.outputs.release == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Install build tools
        if: steps.version.outputs.release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnome-shell libglib2.0-bin python3
      - name: Build and validate release ZIP
        if: steps.version.outputs.release == 'true'
        run: |
          npm ci --ignore-scripts
          npm run check
      - name: Publish GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release.py publish
